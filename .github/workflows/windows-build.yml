name: KYMA Windows x64 Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/KymaSoho.csproj -r win-x64

      - name: Build and publish self-contained
        run: dotnet publish src/KymaSoho.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/KymaSoho.exe')) { throw 'KymaSoho.exe missing' }
          Get-Item 'publish/KymaSoho.exe' | Format-List Name,Length

      - name: Upload complete Windows package
        uses: actions/upload-artifact@v4
        with:
          name: KYMA-RADIO-AUTOMATION-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30
